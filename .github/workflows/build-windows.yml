name: Build Windows Client
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checkout sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: testing
          path: sing-box
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false
      - name: Set version
        working-directory: sing-box
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_ENV"
      - name: Set outputs
        id: outputs
        working-directory: sing-box
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
  build_windows_client:
    name: Build Windows client
    runs-on: windows-latest
    needs:
      - calculate_version
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Checkout sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: testing
          path: sing-box
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false
      - name: sing-box Extra Modify
        shell: bash
        run: |
          openssl des3 \
            -md sha256 \
            -d \
            -k ${{ secrets.TAR_PASS }} \
            -salt \
            -in extra_v2.tar.gz \
            | tar -xzvf -
          bash modify.sh
      - name: Checkout desktop client
        working-directory: sing-box
        run: |
          git submodule update --init clients/desktop
      - name: Checkout desktop submodules
        working-directory: sing-box
        run: |
          git -C clients/desktop submodule update --init --recursive
      - name: win Modify
        shell: bash
        run: |
          bash modify_win.sh
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-desktop-windows-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: |
            go-mod-desktop-windows-
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            sing-box/clients/desktop/bin/windows-share-toolchain/cargo-target
          key: windows-share-x86_64-pc-windows-msvc-${{
            hashFiles('sing-box/clients/desktop/native/windows-share/Cargo.lock')
            }}
          restore-keys: |
            windows-share-x86_64-pc-windows-msvc-
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: sing-box/clients/desktop/package.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: sing-box/clients/desktop/package.json
          cache: pnpm
          cache-dependency-path: |
            sing-box/clients/desktop/pnpm-lock.yaml
            sing-box/clients/desktop/dashboard/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: sing-box
        run: |
          pnpm -C clients/desktop install
      - name: Disable signing
        shell: bash
        run: |
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          echo "WIN_CSC_LINK=" >> "$GITHUB_ENV"
          echo "WIN_CSC_KEY_PASSWORD=" >> "$GITHUB_ENV"
          echo "CSC_LINK=" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=" >> "$GITHUB_ENV"
      - name: Print electron-builder config
        working-directory: sing-box/clients/desktop
        shell: bash
        run: |
          pnpm exec electron-builder --config.print > builder-config.txt || true
          echo "===== CONFIG ====="
          wc -c builder-config.txt
          cat builder-config.txt
      - name: Build Windows
        working-directory: sing-box
        run: |
          pnpm -C clients/desktop package:win -- x64
      - name: Prepare upload
        working-directory: sing-box
        shell: pwsh
        run: |          
          $artifacts = @(Get-ChildItem clients/desktop/release/SFW-*.exe -File)

          if ($artifacts.Count -ne 1) {
            throw "Expected one Windows installer, found $($artifacts.Count)"
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item `
            $artifacts.FullName `
            dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: sing-box/dist
